<div id="research-canvas">
 <header class="rc-head"><div><span>paper / playground</span><h2>Concept canvas</h2></div><span class="rc-count">12 concepts · 12 relationships</span></header>
 <div class="rc-tools"><label>Find a concept <select id="rc-picker"></select></label><div class="rc-zoom"><button type="button" id="rc-out" aria-label="Zoom out">−</button><output id="rc-zoom-value">100%</output><button type="button" id="rc-in" aria-label="Zoom in">+</button><button type="button" id="rc-fit">Fit map</button></div></div>
 <div id="rc-viewport" aria-label="Concept graph. Drag the background to pan. Use zoom controls or Find a concept to navigate."><div id="rc-world"><svg id="rc-edges" viewBox="0 0 850 630" aria-hidden="true"></svg><div id="rc-nodes"></div></div><span class="rc-hint">Drag canvas to pan · select a node to inspect</span></div>
 <div class="rc-inspector"><div aria-live="polite"><span id="rc-group"></span><h3 id="rc-title"></h3><p id="rc-description"></p></div><div><h4>Connected ideas</h4><div id="rc-relations"></div></div></div>
</div>
<style>
#research-canvas{--rc-bg:light-dark(#f6f8f8,#18252b);--rc-panel:light-dark(#fff,#23343b);--rc-ink:light-dark(#263d45,#e3edef);--rc-muted:light-dark(#62777e,#afc2c9);--rc-line:light-dark(#c6d2d5,#52676f);--rc-dot:light-dark(#cfdadd,#354a53);--rc-accent:light-dark(#197b7c,#89cfca);--rc-soft:light-dark(#e9f3f1,#294347);font:14px/1.5 'Segoe UI',Arial,sans-serif;background:var(--rc-bg);color:var(--rc-ink);border:1px solid var(--rc-line);border-radius:10px;overflow:hidden}
#research-canvas *{box-sizing:border-box}#research-canvas h2,#research-canvas h3,#research-canvas h4,#research-canvas p{margin:0}#research-canvas .rc-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 105px 22px 24px;background:var(--rc-panel);border-bottom:1px solid var(--rc-line)}#research-canvas .rc-head div>span{font:11px Consolas,monospace;color:var(--rc-muted)}#research-canvas h2{font-size:23px;line-height:1.3;font-weight:500;margin-top:6px}#research-canvas .rc-count{font-size:12px;color:var(--rc-muted)}#research-canvas .rc-tools{display:flex;align-items:end;justify-content:space-between;gap:14px;padding:14px 20px;background:var(--rc-panel);border-bottom:1px solid var(--rc-line)}#research-canvas label{font-size:11px;color:var(--rc-muted);min-width:0}#research-canvas select{display:block;margin-top:5px;width:240px;max-width:100%;padding:9px;font:13px 'Segoe UI',sans-serif;color:var(--rc-ink);background:var(--rc-bg);border:1px solid var(--rc-line);border-radius:5px;min-height:40px}#research-canvas button{color:var(--rc-ink);background:var(--rc-panel);border:1px solid var(--rc-line);border-radius:5px;min-height:40px;padding:8px 12px;font:13px 'Segoe UI',sans-serif}#research-canvas button:disabled{opacity:.4}#research-canvas .rc-zoom{display:flex;align-items:center;gap:7px}#research-canvas .rc-zoom output{font:12px Consolas,monospace;min-width:40px;text-align:center}#research-canvas #rc-viewport{height:630px;position:relative;overflow:hidden;background-image:radial-gradient(var(--rc-dot) 1px,transparent 1px);background-size:18px 18px;touch-action:pan-y;cursor:grab}#research-canvas #rc-viewport.rc-dragging{cursor:grabbing}#research-canvas #rc-world{position:absolute;width:850px;height:630px;transform-origin:0 0}#research-canvas #rc-edges{position:absolute;inset:0;width:850px;height:630px;overflow:visible;pointer-events:none}#research-canvas .rc-node{position:absolute;width:100px;height:76px;transform:translate(-50%,-50%);border-radius:13px;border:1.5px solid var(--rc-line);padding:0;background:var(--rc-panel);box-shadow:0 2px 4px color-mix(in srgb,var(--rc-ink) 6%,transparent)}#research-canvas .rc-node::before,#research-canvas .rc-node::after{content:'';position:absolute;width:10px;height:10px;border:1.5px solid var(--rc-muted);background:var(--rc-panel);border-radius:50%;top:calc(50% - 5px)}#research-canvas .rc-node::before{left:-6px}#research-canvas .rc-node::after{right:-6px}#research-canvas .rc-symbol{display:block;font:24px/1.2 'Cambria Math',Consolas,monospace;color:var(--rc-accent)}#research-canvas .rc-node-name{position:absolute;top:86px;left:50%;transform:translateX(-50%);width:154px;text-align:center;font:13px/1.3 'Segoe UI',sans-serif;font-weight:500;color:var(--rc-ink)}#research-canvas .rc-node[aria-pressed=true]{border:2px solid var(--rc-accent);background:var(--rc-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--rc-accent) 12%,transparent)}#research-canvas .rc-node[aria-pressed=true]::before,#research-canvas .rc-node[aria-pressed=true]::after{border-color:var(--rc-accent)}#research-canvas .rc-hint{position:absolute;bottom:12px;left:14px;font-size:11px;color:var(--rc-muted);background:var(--rc-bg);padding:4px 7px;pointer-events:none}#research-canvas .rc-inspector{display:grid;grid-template-columns:1fr 1fr;gap:32px;background:var(--rc-panel);border-top:1px solid var(--rc-line);padding:24px}#research-canvas #rc-group{font:11px Consolas,monospace;color:var(--rc-accent)}#research-canvas h3{font-size:20px;font-weight:500;margin:8px 0 12px}#research-canvas p{font-size:13px;color:var(--rc-muted)}#research-canvas h4{font-size:13px;font-weight:500;margin-bottom:10px}#research-canvas .rc-relation{font-size:12px;padding:8px 0;border-bottom:1px solid var(--rc-line)}#research-canvas .rc-relation:last-child{border:0}#research-canvas .rc-relation small{display:block;font-size:11px;color:var(--rc-muted);margin-top:3px}
@media(max-width:650px){#research-canvas .rc-tools{flex-wrap:wrap;align-items:center;padding:12px}#research-canvas .rc-tools label{width:100%}#research-canvas select{width:100%;font-size:16px}#research-canvas .rc-head{padding:18px 100px 18px 18px}#research-canvas .rc-count{display:none}#research-canvas #rc-viewport{height:450px}#research-canvas .rc-inspector{grid-template-columns:1fr;gap:22px;padding:20px}#research-canvas button{min-height:44px}}
</style>
<script>
(()=>{'use strict';const root=document.getElementById('research-canvas'),$=s=>root.querySelector(s),ns='http://www.w3.org/2000/svg';
const concepts=[
 ['recurrence','Sequential recurrence','Motivation','Computing positions in sequence limits parallel processing within a training example.'],
 ['attention','Attention function','Mechanism','Match a query against keys, then combine values using the resulting weights.'],
 ['scaled','Scaled dot-product attention','Mechanism','Scale query–key dot products, apply softmax, and use the weights to combine values.'],
 ['roles','Query, key & value roles','Representations','Queries ask, keys support matching, and values supply the content that is combined.'],
 ['multi','Multi-head attention','Architecture','Parallel attention heads use separate learned projections; their outputs are concatenated and projected.'],
 ['masking','Decoder masking','Architecture','Masking prevents decoder self-attention from using later output positions.'],
 ['position','Positional encoding','Architecture','Position information is added because attention alone does not encode sequence order.'],
 ['feedforward','Position-wise feed-forward','Architecture','The same feed-forward network transforms each position independently.'],
 ['residual','Residuals & layer normalization','Architecture','Residual connections and layer normalization wrap the model’s sub-layers.'],
 ['path','Maximum path length','Analysis','Path length describes how many operations separate positions in the model.'],
 ['bleu','BLEU score','Evaluation','The paper uses translation quality measurements to compare models and ablations.'],
 ['restricted','Restricted self-attention','Extension','Restricting attention to a neighborhood changes its cost and maximum path length.']
].map(([id,name,group,summary])=>({id,name,group,summary}));const byId=Object.fromEntries(concepts.map(n=>[n.id,n]));
const edges=[
 ['recurrence','attention','motivates replacement','motivates replacing recurrence with attention','s0007 · s0009'],
 ['scaled','attention','implements','is a specific implementation of the attention function','s0027'],
 ['scaled','roles','uses Q, K & V','requires distinct query, key, and value roles','s0025 · s0027'],
 ['multi','scaled','runs in parallel','runs scaled dot-product attention in parallel heads','s0036 · s0038'],
 ['multi','roles','projects separately','learns separate projections for queries, keys, and values in each head','s0036 · s0039'],
 ['masking','multi','masks decoder use','modifies the decoder self-attention use of multi-head attention','s0045'],
 ['position','attention','supplies order','supplies order information that attention alone lacks','s0053'],
 ['residual','feedforward','wraps sub-layer','wraps the position-wise feed-forward sub-layer','s0021'],
 ['path','attention','constant for','is constant for a self-attention layer','s0063'],
 ['restricted','path','increases path','increases maximum path length to O(n/r)','s0064'],
 ['bleu','multi','evaluates heads','is used to compare head-count ablations','s0095'],
 ['bleu','position','compares choices','is used to compare learned and sinusoidal position encodings','s0096']
].map(([from,to,short,label,refs],i)=>({id:'r'+i,from,to,short,label,refs}));

const positions={masking:[90,90],bleu:[90,280],restricted:[90,470],multi:[300,90],position:[300,280],path:[300,470],scaled:[510,90],recurrence:[510,280],roles:[740,90],attention:[740,280],residual:[510,500],feedforward:[740,500]};
const symbols={masking:'M',bleu:'BLEU',restricted:'r',multi:'h',position:'PE',path:'L',scaled:'QKᵀ',recurrence:'t−1',roles:'Q K V',attention:'Σ',residual:'⊕',feedforward:'FF'};let selected='attention',zoom=1,panX=0,panY=0;const nodes=new Map(),paths=new Map();
const edgeSVG=$('#rc-edges'),defs=document.createElementNS(ns,'defs');defs.innerHTML='<marker id="rc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>';edgeSVG.append(defs);
for(const e of edges){const a=positions[e.from],b=positions[e.to],sx=a[0]+56,tx=b[0]-58,sy=a[1],ty=b[1],mid=(sx+tx)/2,p=document.createElementNS(ns,'path');let d=`M${sx} ${sy} C${mid} ${sy},${mid} ${ty},${tx} ${ty}`;if(e.from==='multi'&&e.to==='roles')d=`M${sx} ${sy} C${sx+20} ${sy},${sx+20} 24,${sx+45} 24 H${tx-30} Q${tx} 24 ${tx} ${ty}`;if(e.from==='position'&&e.to==='attention')d='M' + sx + ' ' + sy + ' C' + (sx+24) + ' ' + sy + ',' + (sx+24) + ' 205,' + (sx+45) + ' 205 H' + (tx-35) + ' Q' + tx + ' 205 '+tx+' '+ty;if(e.from==='path'&&e.to==='attention')d=`M${sx} ${sy} H400 Q415 ${sy} 415 ${sy-20} V385 Q415 365 435 365 H645 Q${tx} 365 ${tx} ${ty}`;p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('marker-end','url(#rc-arrow)');edgeSVG.append(p);paths.set(e.id,p)}
for(const c of concepts){const option=document.createElement('option');option.value=c.id;option.textContent=c.name;$('#rc-picker').append(option);const b=document.createElement('button');b.type='button';b.className='rc-node cursor-interaction';b.dataset.id=c.id;b.style.left=positions[c.id][0]+'px';b.style.top=positions[c.id][1]+'px';b.setAttribute('aria-label',c.name);const mark=document.createElement('span');mark.className='rc-symbol';mark.textContent=symbols[c.id];mark.setAttribute('aria-hidden','true');const label=document.createElement('span');label.className='rc-node-name';label.textContent=c.name;b.append(mark,label);b.addEventListener('click',()=>select(c.id));$('#rc-nodes').append(b);nodes.set(c.id,b)}
function save(){try{window.openai?.setWidgetState?.({modelContent:{design:'Research lab with n8n-style concept canvas',concept:byId[selected].name},privateContent:{selected}})?.catch?.(()=>{})}catch{}}
function select(id,persist=true){if(!byId[id])return;selected=id;$('#rc-picker').value=id;nodes.forEach((b,key)=>b.setAttribute('aria-pressed',String(key===id)));const related=edges.filter(e=>e.from===id||e.to===id);paths.forEach((p,key)=>{const active=related.some(e=>e.id===key);p.setAttribute('stroke',active?'var(--rc-accent)':'var(--rc-line)');p.setAttribute('stroke-width',active?'2.5':'1.5')});$('#rc-group').textContent=byId[id].group.toUpperCase();$('#rc-title').textContent=byId[id].name;$('#rc-description').textContent=byId[id].summary;$('#rc-relations').replaceChildren(...related.map(e=>{const r=document.createElement('div');r.className='rc-relation';r.textContent=byId[e.from].name+' → '+e.short+' → '+byId[e.to].name;const source=document.createElement('small');source.textContent='Paper references: '+e.refs;r.append(source);return r}));if(persist)save()}
function camera(){$('#rc-world').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;$('#rc-zoom-value').textContent=Math.round(zoom*100)+'%';$('#rc-out').disabled=zoom<=.3;$('#rc-in').disabled=zoom>=2}
function fit(){const box=$('#rc-viewport');zoom=Math.min(1,(box.clientWidth-24)/850,(box.clientHeight-35)/630);panX=(box.clientWidth-850*zoom)/2;panY=8;camera()}
function magnify(factor){const box=$('#rc-viewport'),next=Math.max(.3,Math.min(2,zoom*factor)),cx=box.clientWidth/2,cy=box.clientHeight/2;panX=cx-(cx-panX)*next/zoom;panY=cy-(cy-panY)*next/zoom;zoom=next;camera()}
$('#rc-fit').onclick=fit;$('#rc-in').onclick=()=>magnify(1.2);$('#rc-out').onclick=()=>magnify(1/1.2);$('#rc-picker').onchange=e=>{select(e.target.value);fit()};let drag=null;const viewport=$('#rc-viewport');viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};viewport.setPointerCapture(e.pointerId);viewport.classList.add('rc-dragging')});viewport.addEventListener('pointermove',e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;camera()});function end(){drag=null;viewport.classList.remove('rc-dragging')}viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();magnify(e.deltaY<0?1.1:1/1.1)}},{passive:false});
try{if(byId[window.openai?.widgetState?.privateContent?.selected])selected=window.openai.widgetState.privateContent.selected}catch{}window.addEventListener('openai:set_globals',e=>{const id=e.detail?.globals?.widgetState?.privateContent?.selected;if(byId[id])select(id,false)});new ResizeObserver(fit).observe(viewport);select(selected,false);fit();root.querySelectorAll('button,select').forEach(e=>e.classList.add('cursor-interaction'));root.dataset.ready='true';
})();
</script>
